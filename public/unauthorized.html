<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>403 - Access Denied</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <div class="auth-card text-center">
      
      <div class="error-badge">403 FORBIDDEN</div>
      <h1 class="error-title">Access Denied</h1>
      <p class="subtitle">
        Your account is authenticated, but you do not possess the required <strong>ADMIN</strong> role to view this page or perform admin actions.
      </p>

      <div class="alert-box alert-warning">
        ⚠️ This unauthorized access attempt has been recorded in the server security audit log.
      </div>

      <div class="action-buttons">
        <a href="/" class="btn-primary" style="text-decoration: none; display: inline-block;">Return to Portal</a>
        <button id="btnLogout" class="btn-secondary" style="margin-top: 10px;">Sign Out</button>
      </div>

    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
